<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梅澤雅弘 自己紹介と作品紹介</title><style>body{margin:0;background:#102b29;color:#f3f3ed;font-family:system-ui;display:grid;place-items:center;height:100vh}main{text-align:center}h1{font-size:32px}button{font-size:28px;padding:24px 64px;border:0;border-radius:8px;background:#d8eadf;color:#183e3b;cursor:pointer}p{font-size:18px}video{display:none;width:100%;height:100%;background:black}video.on{display:block}main.off{display:none}</style><main id="menu"><h1>梅澤雅弘<br>自己紹介と作品紹介</h1><p>音量と画面を準備してから、下のボタンを押してください。</p><button id="start">上映スタート</button><p>最初から最後まで、自動で再生します。</p><p id="status"></p></main><video id="v" controls preload="metadata" playsinline src="梅澤雅弘_ワンクリック上映.mp4"></video><script>const v=document.getElementById('v'),menu=document.getElementById('menu');document.getElementById('start').onclick=async()=>{try{menu.classList.add('off');v.classList.add('on');v.currentTime=0;const play=v.play();if(v.requestFullscreen)v.requestFullscreen().catch(()=>{});await play;}catch(e){menu.classList.remove('off');v.classList.remove('on');document.getElementById('status').textContent='再生できませんでした。同じフォルダのMP4を直接開いてください。';}};v.onended=()=>{if(document.fullscreenElement)document.exitFullscreen();menu.classList.remove('off');v.classList.remove('on');document.getElementById('start').textContent='もう一度上映する';};</script></html>
